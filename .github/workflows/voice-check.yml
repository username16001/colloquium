name: Check voice server manually
on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Учебные примеры для проверки'
        default: all
        type: choice
        options: [all, incomplete, code, audio]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare synthetic iPhone recording format
        if: inputs.case == 'audio'
        run: ffmpeg -v error -y -i tests/fixtures/python-answer.wav -c:a aac tmp-answer.m4a
      - run: |
          if [ "$CHECK_CASE" = "audio" ]; then
            python scripts/check_voice.py --case audio --audio-file tmp-answer.m4a
          else
            python scripts/check_voice.py --case "$CHECK_CASE"
          fi
        env:
          CHECK_CASE: ${{ inputs.case || 'all' }}
